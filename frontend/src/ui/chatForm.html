<!-- src/ui/chatForm.html -->
<style>
    #chat-form {
        width: 600px;
        height: 400px;
        background-color: rgba(30, 30, 30, 0.9);
        border: 2px solid #555;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        font-family: 'Malgun Gothic', sans-serif;
    }
    #chatLog {
        flex-grow: 1;
        overflow-y: auto;
        padding: 15px;
        color: white;
        background-color: #111;
        border-radius: 5px;
        margin: 10px;
        font-size: 16px;
        line-height: 1.5;
    }
    #chatLog p {
        margin: 0 0 10px 0;
    }
    #input-container {
        display: flex;
        padding: 10px;
    }
    input[name="playerInput"] {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #444;
        background-color: #222;
        color: white;
        border-radius: 5px;
        margin-right: 10px;
    }
    button[name="sendButton"] {
        padding: 10px 20px;
        border: none;
        background-color: #4CAF50;
        color: white;
        cursor: pointer;
        border-radius: 5px;
    }
    button[name="sendButton"]:hover {
        background-color: #45a049;
    }
</style>

<div id="chat-form">
    <div id="chatLog"></div>
    <div id="input-container">
        <input type="text" name="playerInput" placeholder="할 말을 입력하세요..." autofocus>
        <button name="sendButton">전송</button>
    </div>
</div>
