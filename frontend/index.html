<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="직장 상사와 쏟아지는 업무를 물리치고 퇴근하세요! 로그인 없이 즐기는 탈출 오피스." />
    <title>탈출 오피스</title>
    <link rel="icon" href="%BASE_URL%assets/weapon/coffee.png" />
    
    <!-- ✨ 모든 스타일을 여기에 통합합니다 -->
    <style>
      /* --- 기존 body 및 canvas 스타일 --- */
      body {
        margin: 0;
        background-color: black;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      canvas {
        border: 1px solid white; /* 게임 화면 테두리 (선택 사항) */
      }
      #chat-form {
        width: min(600px, 90vw);
        height: min(400px, 65vh);
        background-color: rgba(30, 30, 30, 0.9);
        border: 2px solid #555;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        font-family: 'Malgun Gothic', sans-serif;
        box-sizing: border-box; /* 패딩과 테두리가 너비/높이에 포함되도록 설정 */
      }
      #chatLog {
        min-height: 0;
        flex-grow: 1;
        overflow-y: auto;
        padding: 15px;
        color: white;
        background-color: #111;
        border-radius: 5px;
        margin: 10px;
        font-size: 16px;
        line-height: 1.5;
      }
      #chatLog p {
        margin: 0 0 10px 0;
      }
      #input-container {
        display: flex;
        padding: 10px;
        border-top: 1px solid #444; /* 구분선 추가 */
      }
      input[name="playerInput"] {
        min-width: 0;
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #444;
        background-color: #222;
        color: white;
        border-radius: 5px;
        margin-right: 10px;
        font-size: 16px; /* 폰트 크기 명시 */
      }
      button[name="sendButton"] {
        padding: 10px 20px;
        border: none;
        background-color: #4CAF50;
        color: white;
        cursor: pointer;
        border-radius: 5px;
        font-size: 16px; /* 폰트 크기 명시 */
      }
      button[name="sendButton"]:hover {
        background-color: #45a049;
      }
      #chat-heading { display: flex; align-items: center; gap: 12px; padding: 12px; color: white; }
      #chat-heading img { width: 64px; height: 64px; object-fit: contain; }
      button[name="leaveButton"] { margin-left: auto; padding: 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <!-- ✨ 게임이 들어갈 컨테이너 div는 그대로 유지 -->
    <div id="game-container"></div>
    
    <!-- main.js 스크립트 태그는 그대로 둡니다 -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
